# DocMorph 配置示例
#
# 程序首次运行时会自动在程序目录下生成 config.ini（与 run.py / DocMorph.exe 同级），
# 本文件仅作为字段说明；如需自定义，请修改程序目录下的 config.ini，
# 或使用：docmorph config --init  /  docmorph config --path
#
# 运行时数据（日志 / 缓存 / 临时文件 / WebView 数据）统一位于程序目录下的 runtime/，
# 不写入 %LOCALAPPDATA% / %APPDATA%；把整个程序目录拷到其它机器后仍可直接运行。
#
# 读取优先级：代码默认值 < 配置文件 < DOCMORPH_* 环境变量 < 命令行/界面参数

[meta]
version = 2

[paths]
# 输入 / 输出目录：留空 = 默认（用户文档下的 DocMorph\input|output）
# 注意：不要把输入输出目录设为源代码目录，避免污染项目
input_directory =
output_directory =
# 日志目录：留空 = 程序目录下的 runtime\logs
log_directory =
# 临时工作区：留空 = 程序目录下的 runtime\temp\<会话 id>
temp_directory =

[conversion]
# 目标文件已存在时：rename（自动改名，默认，绝不覆盖）/ overwrite / skip
conflict_policy = rename
# PDF 引擎偏好：auto / word / wps / libreoffice / weasyprint
# auto 表示按 CONVERSION_MATRIX.md 的优先级自动选择可用引擎
pdf_backend_preference = auto
# 批量并发线程数（Word / Excel 转换始终串行执行）
max_workers = 4
# 单个 Office 转换的最长等待秒数（超时后强制结束该次转换）
office_timeout_seconds = 300
# 批量转换是否保留输入目录结构（避免不同子目录同名文件互相覆盖）
keep_structure = true
# xlsx 转 csv 的模式：sheets（每个工作表一个文件）/ merged / first
xlsx_csv_mode = sheets
# 转 Markdown 时是否把图片抽取到 <文件名>_media 目录
extract_media = true

[defaults]
# 未单独指定目标格式时使用的兜底目标
default_target = pdf
# 各源格式的默认目标格式（界面与批量模式的默认值）
target_docx = pdf
target_pdf = docx
target_xlsx = csv
target_md = docx
target_html = pdf
target_txt = docx
target_csv = xlsx
